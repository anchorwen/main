name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Tests and tooling assume an absolute checkout path of D:\cursor (see tests/engine).
      # mklink /J is reliable; GitHub "Re-run failed jobs" uses the OLD workflow from that run —
      # use workflow_dispatch or push to pick up workflow changes.
      - name: Ensure D:/cursor workspace alias
        shell: cmd
        run: |
          if exist D:\cursor rmdir D:\cursor
          mklink /J D:\cursor "%GITHUB_WORKSPACE%"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check (lint)
        run: python -m ruff check core/ apps/ scripts/

      - name: mypy type-check (iron law — no new errors vs baseline)
        run: python scripts/pre_commit_mypy.py

      - name: Omega Protocol compliance scan
        shell: bash
        run: |
          python scripts/omega_gate.py .git/COMMIT_EDITMSG 2>/dev/null || true
          echo "Omega compliance scan complete."

      - name: Prepare V9 shadow fixture data
        run: python scripts/ci_prepare_v9_shadow_fixtures.py

      - name: Verify CI workspace and fixtures
        shell: cmd
        run: |
          if not exist D:\cursor\core\deployment\domain_keys.py exit 1
          if not exist D:\cursor\data\snapshots\v9_shadow_long.json exit 1
          if not exist D:\cursor\data\replays\v9_shadow_baselines\manifest.json exit 1

      - name: Pytest (runtime contract guard)
        run: |
          python -m pytest tests/engine/test_runtime_contract_guard.py
          python -m pytest tests/engine/test_communication_replay_executor.py::test_replay_executor_priority_contract_matrix
          python -m pytest tests/engine/test_v9_shadow_smoke.py::test_v9_shadow_apply_stable_output_contract_mirrors_replay_execution_fields
          python -m pytest tests/engine/test_live_read_only_preflight.py::test_live_preflight_main_supports_micro_live_mode

      - name: Pytest (tests/engine)
        run: python -m pytest tests/engine

      - name: Pytest (governance contracts)
        run: python -m pytest --governance-contracts
