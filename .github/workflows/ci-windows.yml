name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      TZ: "UTC"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Tests and tooling assume an absolute checkout path of D:\cursor (see tests/engine).
      # mklink /J is reliable; GitHub "Re-run failed jobs" uses the OLD workflow from that run —
      # use workflow_dispatch or push to pick up workflow changes.
      - name: Ensure D:/cursor workspace alias
        shell: cmd
        run: |
          if exist D:\cursor rmdir D:\cursor
          mklink /J D:\cursor "%GITHUB_WORKSPACE%"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-timeout

      # ── Lint / type-check / compliance: shard 1 only (no need to duplicate) ──

      - name: Ruff check (lint)
        if: matrix.shard == 1
        run: python -m ruff check core/ apps/ scripts/

      - name: mypy type-check (iron law — no new errors vs baseline)
        if: matrix.shard == 1
        run: python scripts/pre_commit_mypy.py

      - name: Omega Protocol compliance scan
        if: matrix.shard == 1
        shell: bash
        run: |
          python scripts/omega_gate.py .git/COMMIT_EDITMSG 2>/dev/null || true
          echo "Omega compliance scan complete."

      # ── Fixtures: both shards need V9 shadow data ──

      - name: Prepare V9 shadow fixture data
        run: python scripts/ci_prepare_v9_shadow_fixtures.py

      - name: Verify CI workspace and fixtures
        shell: cmd
        run: |
          if not exist D:\cursor\core\deployment\domain_keys.py exit 1
          if not exist D:\cursor\data\snapshots\v9_shadow_long.json exit 1
          if not exist D:\cursor\data\replays\v9_shadow_baselines\manifest.json exit 1

      # ── Wipe pytest temp dir: break the garbage accumulation cycle ──
      # Previous runs that timed out leave garbage-* dirs behind.
      # Each leftover dir makes the next run's atexit cleanup slower
      # (Windows Defender scans every file during deletion).
      # Wiping before pytest ensures a clean slate every time.

      - name: Wipe pytest temp dir (break garbage accumulation cycle)
        shell: cmd
        run: |
          if exist D:\cursor\pytest-tmp rmdir /s /q D:\cursor\pytest-tmp
          mkdir D:\cursor\pytest-tmp

      # ── Contract guard: shard 1 only ──

      - name: Pytest (runtime contract guard — 4 critical gates)
        if: matrix.shard == 1
        run: |
          python -m pytest tests/engine/test_runtime_contract_guard.py
          python -m pytest tests/engine/test_communication_replay_executor.py::test_replay_executor_priority_contract_matrix
          python -m pytest tests/engine/test_v9_shadow_smoke.py::test_v9_shadow_apply_stable_output_contract_mirrors_replay_execution_fields
          python -m pytest tests/engine/test_live_read_only_preflight.py::test_live_preflight_main_supports_micro_live_mode

      # ── Fast-track: split across 2 independent runners (matrix shard 1 / 2) ──
      # No step-level timeout — let pytest finish its cleanup naturally.
      # Job-level 60-min timeout is the safety net.
      # --basetemp + pre-run wipe break the temp-dir garbage accumulation cycle.
      # shell: bash avoids PowerShell exit-code inconsistencies on Windows.

      - name: Pytest (fast track shard 1/2 — execution, unit, runtime, brains, …)
        if: matrix.shard == 1
        shell: bash
        run: |
          python -m pytest \
            tests/execution/ tests/unit/ tests/runtime/ tests/brains/ tests/features/ \
            tests/observability/ tests/metrics/ tests/feedback/ tests/alpha/ tests/strategies/ \
            tests/risk/ tests/market/ tests/backtest/ tests/deployment/ \
            -m "not slow" -o "addopts=" -p no:cov -q --tb=short --durations=20 \
            --basetemp=D:/cursor/pytest-tmp -o tmp_path_retention_count=0

      - name: Pytest (fast track shard 2/2 — engine, data, contracts, resilience, …)
        if: matrix.shard == 2
        shell: bash
        run: |
          python -m pytest \
            tests/engine/ tests/data/ tests/contracts/ tests/scripts/ tests/resilience/ \
            tests/training/ tests/ledger/ tests/infrastructure/ tests/governance/ \
            tests/parliament/ tests/protocol/ tests/stress/ tests/consistency/ \
            tests/state/ tests/mock_kit/ tests/config/ \
            -m "not slow" -o "addopts=" -p no:cov -q --tb=short --durations=20 \
            --basetemp=D:/cursor/pytest-tmp -o tmp_path_retention_count=0

      # ── Slow track + governance contracts: shard 1 only ──

      - name: Pytest (slow track — engine integration/E2E, with coverage)
        if: matrix.shard == 1
        run: python -m pytest tests/ -m "slow"

      - name: Pytest (governance contracts)
        if: matrix.shard == 1
        run: python -m pytest --governance-contracts
