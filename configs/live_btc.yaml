adapter:
  name: mt5_zmq
alert:
  channels:
    dingtalk: true
    dingtalk_webhook_url: https://oapi.dingtalk.com/robot/send?access_token=f33f64c01a0323ee7859fab62495addd0ad75c02182425f91b5ffe4ffbf9ce46
    log: true
    slack: false
  enabled: true
  thresholds:
    circuit_breaker_trip: true
    consecutive_losers: 5
    critical_cooldown_minutes: 15
    daily_loss_limit: -30.0
    single_trade_loss_threshold: -10.0
    strategy_degradation_loss: -15.0
    strategy_degradation_wr: 0.35
    warning_cooldown_minutes: 60
    win_rate_collapse: 0.25
alert_system:
  rules:
  - context_key: error_rate
    cooldown_seconds: 60
    id: RULE-001
    name: high_error_rate
    operator: gt
    severity: critical
    threshold: 0.1
  - context_key: circuit_state
    cooldown_seconds: 120
    id: RULE-002
    name: circuit_breaker_open
    operator: eq
    severity: critical
    threshold: open
  - context_key: bridge_last_ack_seconds
    cooldown_seconds: 120
    id: RULE-003
    name: bridge_heartbeat_missed
    operator: gt
    severity: critical
    threshold: 120
  - context_key: frozen_brain_count
    cooldown_seconds: 600
    id: RULE-004
    name: brain_frozen
    operator: gt
    severity: warning
    threshold: 0
  - context_key: position_utilization
    cooldown_seconds: 300
    id: RULE-005
    name: position_limit_near
    operator: gt
    severity: warning
    threshold: 0.8
  - context_key: cycle_duration_seconds
    cooldown_seconds: 300
    id: RULE-006
    name: cycle_stall
    operator: gt
    severity: critical
    threshold: 180
  - context_key: daily_pnl_usd
    cooldown_seconds: 300
    id: RULE-007
    name: daily_loss_exceeded
    operator: lt
    severity: critical
    threshold: -30.0
  - context_key: consecutive_losses
    cooldown_seconds: 600
    id: RULE-008
    name: consecutive_losses
    operator: gt
    severity: warning
    threshold: 5
  - composite_kind: win_rate_collapse
    cooldown_seconds: 600
    id: RULE-009
    min_window: 20
    name: win_rate_collapse
    severity: critical
    threshold: 0.25
    type: composite
  - composite_kind: strategy_degradation
    cooldown_seconds: 1800
    id: RULE-010
    name: strategy_degradation
    pnl_threshold: -15.0
    severity: warning
    type: composite
    wr_threshold: 0.35
  - context_key: throttle_rate
    cooldown_seconds: 300
    id: RULE-011
    name: high_throttle_rate
    operator: gt
    severity: warning
    threshold: 0.3
  - context_key: data_health_critical_fail_count
    cooldown_seconds: 300
    description: Any CRITICAL-tier data source in fail or missing status
    id: RULE-012
    name: data_source_critical_failure
    operator: gt
    severity: critical
    threshold: 0
  - context_key: data_health_warn_count
    cooldown_seconds: 600
    description: More than 2 data sources in warn status
    id: RULE-013
    name: data_health_degraded
    operator: gt
    severity: warning
    threshold: 2
  - context_key: cross_source_discrepancy_count
    cooldown_seconds: 600
    description: Any cross-source validation failure
    id: RULE-014
    name: cross_source_discrepancy
    operator: gt
    severity: critical
    threshold: 0
  - context_key: orphan_subsystem_count
    cooldown_seconds: 1800
    description: Subsystem with zero-data pattern detected (pipeline never wired)
    id: RULE-015
    name: orphan_subsystem_detected
    operator: gt
    severity: warning
    threshold: 0
  - context_key: stale_state_file_count
    cooldown_seconds: 600
    description: State file not updated within expected cadence
    id: RULE-016
    name: state_file_stale
    operator: gt
    severity: warning
    threshold: 0
brains:
  registry_entries:
  # ── FIX-20260616-095: V4 RE-ENABLED — model verified 41-dim (num_feature=41)
  #   +$64 across 105 trades.  Router serves btc_macro_enhanced_41 contract.
  - enabled: true
    path: configs/brains_btc/BTC_Swing_V4.json
  # ── V9_H1 RETIRED (FIX-20260625-136): -34.7R, WR=39.7%, vote_weight=0.0 ghost node → archive ──
  # ── V10_M15 REMOVED (DQAF-20260615-009g): stale 37-dim model, magic collision, artifact_hash mismatch ──
  # ── V12_H1_Survival RETIRED (FIX-20260626-140): SL=3.0/TP=2.0 → 87.1% TP degenerate labels → constant model (σ=0.014). Replaced by V12_H1_15. ──
  - enabled: false
    path: configs/brains_btc/BTC_Swing_V12_H1_Survival.json
  # ── RETIRED (DQAF-20260707-003): V12_H1_15 kill-switch — Wasserstein=0.0084
  #   zero directional discrimination, 48-dim H1 feature engineering failed
  #   (Wasserstein worsened to 0.0019).  Strategy line btc_swing_h1 also retired.
  #   Path C pending: horizon=4 retrain with 48-dim features.
  - enabled: false
    path: configs/brains_btc/BTC_Swing_V12_H1_15.json
  # ── FIX-20260706-015: B-path binary directional classifier (M5, probation)
  #   43,613 samples, WR=51.1%, XGBoost binary:logistic → binary_directional deadzone.
  #   Shadow observe — signals recorded, not executed. DQAF-20260706-015.
  - enabled: true
    path: configs/brains_btc/BTC_Swing_M5_Binary.json
  # ── BTC Multi-TF Tracer Bullet Expansion (2026-07-13) ──
  # 41-dim V9 schema + DQAF-062 directional labels. All shadow — zero live risk.
  # Each TF has _intent.trading: shadow_only with dead-man switches.
  - enabled: true
    path: configs/brains_btc/BTC_Swing_M15.json
  - enabled: true
    path: configs/brains_btc/BTC_Swing_M30.json
  - enabled: true
    path: configs/brains_btc/BTC_Swing_H1_V2.json
  - enabled: true
    path: configs/brains_btc/BTC_Swing_H4.json
  # ── DLR-001 config drift fix (2026-06-17): Retired fleet removed from registry.
  #   Archive brain configs preserved in configs/brains_btc/archive/ for reference.
