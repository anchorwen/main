adapter:
  name: mt5_zmq
alert:
  channels:
    dingtalk: true
    dingtalk_webhook_url: https://oapi.dingtalk.com/robot/send?access_token=f33f64c01a0323ee7859fab62495addd0ad75c02182425f91b5ffe4ffbf9ce46
    log: true
    slack: false
  enabled: true
  thresholds:
    circuit_breaker_trip: true
    consecutive_losers: 5
    critical_cooldown_minutes: 15
    daily_loss_limit: -30.0
    single_trade_loss_threshold: -10.0
    strategy_degradation_loss: -15.0
    strategy_degradation_wr: 0.35
    warning_cooldown_minutes: 60
    win_rate_collapse: 0.25
alert_system:
  rules:
  - context_key: error_rate
    cooldown_seconds: 60
    id: RULE-001
    name: high_error_rate
    operator: gt
    severity: critical
    threshold: 0.1
  - context_key: circuit_state
    cooldown_seconds: 120
    id: RULE-002
    name: circuit_breaker_open
    operator: eq
    severity: critical
    threshold: open
  - context_key: bridge_last_ack_seconds
    cooldown_seconds: 120
    id: RULE-003
    name: bridge_heartbeat_missed
    operator: gt
    severity: critical
    threshold: 120
  - context_key: frozen_brain_count
    cooldown_seconds: 600
    id: RULE-004
    name: brain_frozen
    operator: gt
    severity: warning
    threshold: 0
  - context_key: position_utilization
    cooldown_seconds: 300
    id: RULE-005
    name: position_limit_near
    operator: gt
    severity: warning
    threshold: 0.8
  - context_key: cycle_duration_seconds
    cooldown_seconds: 300
    id: RULE-006
    name: cycle_stall
    operator: gt
    severity: critical
    threshold: 180
  - context_key: daily_pnl_usd
    cooldown_seconds: 300
    id: RULE-007
    name: daily_loss_exceeded
    operator: lt
    severity: critical
    threshold: -30.0
  - context_key: consecutive_losses
    cooldown_seconds: 600
    id: RULE-008
    name: consecutive_losses
    operator: gt
    severity: warning
    threshold: 5
  - composite_kind: win_rate_collapse
    cooldown_seconds: 600
    id: RULE-009
    min_window: 20
    name: win_rate_collapse
    severity: critical
    threshold: 0.25
    type: composite
  - composite_kind: strategy_degradation
    cooldown_seconds: 1800
    id: RULE-010
    name: strategy_degradation
    pnl_threshold: -15.0
    severity: warning
    type: composite
    wr_threshold: 0.35
  - context_key: throttle_rate
    cooldown_seconds: 300
    id: RULE-011
    name: high_throttle_rate
    operator: gt
    severity: warning
    threshold: 0.3
  - context_key: data_health_critical_fail_count
    cooldown_seconds: 300
    description: Any CRITICAL-tier data source in fail or missing status
    id: RULE-012
    name: data_source_critical_failure
    operator: gt
    severity: critical
    threshold: 0
  - context_key: data_health_warn_count
    cooldown_seconds: 600
    description: More than 2 data sources in warn status
    id: RULE-013
    name: data_health_degraded
    operator: gt
    severity: warning
    threshold: 2
  - context_key: cross_source_discrepancy_count
    cooldown_seconds: 600
    description: Any cross-source validation failure
    id: RULE-014
    name: cross_source_discrepancy
    operator: gt
    severity: critical
    threshold: 0
  - context_key: orphan_subsystem_count
    cooldown_seconds: 1800
    description: Subsystem with zero-data pattern detected (pipeline never wired)
    id: RULE-015
    name: orphan_subsystem_detected
    operator: gt
    severity: warning
    threshold: 0
  - context_key: stale_state_file_count
    cooldown_seconds: 600
    description: State file not updated within expected cadence
    id: RULE-016
    name: state_file_stale
    operator: gt
    severity: warning
    threshold: 0
brains:
  registry_entries:
  # ── FIX-20260616-091: V4 DISABLED — 37-dim model receiving 41-dim input
  #   (TECH_DEBT-004: tensor alignment shift risk).  Only V12 (41-dim) active.
  - enabled: false
    path: configs/brains_btc/BTC_Swing_V4.json
  - enabled: true
    path: configs/brains_btc/BTC_Swing_V9_H1_Survival.json
  # ── V10_M15 REMOVED (DQAF-20260615-009g): stale 37-dim model, magic collision, artifact_hash mismatch ──
  # ── DQAF-20260615-003: V12 H1 Survival (Route B, 41-dim with delta_OU/Hurst) ──
  - enabled: true
    path: configs/brains_btc/BTC_Swing_V12_H1_Survival.json
  # ── Retired fleet (archived) ──
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V4.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V5.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_LGB_V1.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V6_MultiTF_LGB_v2.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V7_MultiTF_LGB_v1.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V8_MultiTF_LGB_v1.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V11_H1_Directional.json
  - enabled: false
    path: configs/brains_btc/archive/BTC_Swing_V11_M15_Directional.json
