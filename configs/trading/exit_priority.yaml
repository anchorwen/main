# V6 Layer B2+B3: Exit Priority Queue + Ratchet Risk Configuration
# FIX-20260629-195 — Phase 0 Foundation
#
# Delta-Zero Law: when global.enabled = false, ALL exit priority logic
# is silently bypassed and the system uses the existing flat-sequential
# exit checks in management_phase.py.  Binary-identical output.
#
# Reference: God's Eye V6.0 ou_brain/config.py ScoutConfig exit parameters

version: "1.0"

global:
  enabled: true  # ← Master kill-switch.  FIX-20260701-205: enabled for CP1 shadow verification.
  shadow_mode: true   # When true: evaluate but log only, do not execute exits.

# ── 5-Stage Gate (Layer B1) ──────────────────────────────────────
stage_gate:
  m15_confirm_bars: 3           # M5 bars to wait for M15 confirmation
  m15_confirm_regime_min: 0.60  # M15 regime must be >= this to confirm
  m15_contradiction_regime: 0.30  # Below this → AT_RISK immediately
  m30_max_adx_for_hold: 30.0    # M30 ADX above this → REDUCE_EXPOSURE
  m30_min_regime_for_hold: 0.55 # M30 regime must be >= this to stay MANAGED
  m30_grace_bars: 6             # First N bars in MANAGED immune to M30 reduction
  schmitt_hysteresis_bars: 3    # Bars of M15 alignment needed for AT_RISK→MANAGED
  at_risk_sl_tighten_mult: 0.7  # Tighten SL to 70% of normal when AT_RISK
  at_risk_block_new_layers: true  # Never add grid layers in AT_RISK

# ── 7-Level Exit Priority Queue (Layer B2) ───────────────────────
# First match wins — higher priority exits preempt lower ones.
exit_queue:

  P1_basket_tp:
    enabled: false
    atr_mult: 1.2            # α in: α × ATR × PointValue × Lots × sqrt(q)/q
    early_stage_mult: 2.0    # Multiply TP target when ENTRY_CONFIRMED (let winners run)

  P2_zscore_flip:
    enabled: false
    confirm_bars: 2           # Bars of sustained flip before exit
    transition_shield: true   # Block profitable exits during KF→OLS estimator handoff

  P3_regime_collapse:
    enabled: false
    m15_regime_pct_of_min: 0.50  # Exit when M15 regime < N% of m15_confirm_regime_min

  P4_circuit_breaker:
    enabled: false
    rule_a_sl_emergency_pct: 75.0    # Emergency: PnL < -75% of total SL distance
    rule_b_slow_burn_sl_pct: 50.0    # Slow-burn: PnL < -50% SL AND N+ declining bars
    rule_b_consecutive_decline_bars: 4  # Bars of uninterrupted PnL decline
    min_bars_for_check: 2            # Grace bars before CB activates
    require_beyond_hl: true          # Slow-burn only after bars_held > half_life
    use_entry_hl: true               # Use min(entry_hl, current_hl) not max
    z_trajectory_unlock: true        # Bypass hl gate when |z| expanding + mu drifting

  P5_premise_invalidation:
    enabled: false
    hl_mult: 3.0              # bars_held > hl × N before checking
    t1_sl_pct: 3.0            # T1: |z| >= |entry_z| AND PnL < -3% SL
    t2_sl_pct: 20.0           # T2: PnL < -20% SL (critical loss, exit regardless)
    t1_dollar_floor: 10.0     # Minimum dollar loss for T1 (protects small positions)
    t2_dollar_floor: 30.0     # Minimum dollar loss for T2

  P6_ratchet_risk:
    breakeven_defense:
      enabled: true  # FIX-20260701-205: shadow-only evaluation (shadow_mode=true)
      atr_mult: 0.3           # FIX-20260703-T1924: Arm when PnL > N × ATR_cost (0.01lot: 0.3×5.9×0.01×100≈$1.77)
      cost_buffer: 0.05       # FIX-20260703-T1924: Close when PnL ≤ $N after armed (0.01lot micro)
    drawdown_lock:
      enabled: true  # FIX-20260701-205: shadow-only evaluation (shadow_mode=true)
      activation_atr: 0.5     # FIX-20260703-T1924: Arm when peak PnL > N × ATR_cost (0.01lot: 0.5×5.9×0.01×100≈$2.95)
      giveback_pct: 35.0      # Close when PnL < peak × (1 - N/100)

  P7_time_stop:
    enabled: true  # FIX-20260703-T1924: shadow-mode enabled for T19/T24 event generation
    hold_mult: 3.0            # × effective half-life
    max_bars: 60              # Hard cap (M5 bars)
    min_bars: 15              # Floor — never exit before this

# ── Per-Strategy Overrides ───────────────────────────────────────
# Each strategy line can override any exit queue parameter.
# Unspecified parameters inherit from the global defaults above.
per_strategy:
  statarb_dynamic:
    exit_queue:
      P2_zscore_flip: { enabled: true }    # Core OU exit — always on for statarb
      P5_premise_invalidation: { enabled: true }  # Fast-entry thesis validation
      P4_circuit_breaker: { enabled: true }
    stage_gate:
      m15_confirm_regime_min: 0.55  # Slightly lower for faster MR cycles

  barrier_12bar:
    exit_queue:
      P2_zscore_flip: { enabled: false }   # Not applicable for barrier strategies
      P5_premise_invalidation: { enabled: false }
      P1_basket_tp: { atr_mult: 1.5 }     # More patient TP for barrier

  h1_swing:
    exit_queue:
      P1_basket_tp: { early_stage_mult: 1.5 }  # Less aggressive early TP for H1
    stage_gate:
      m30_grace_bars: 12  # Longer grace for H1 positions

  h4_swing:
    exit_queue:
      P7_time_stop: { max_bars: 240 }  # 20h at H4 — much longer hold
      P3_regime_collapse: { m15_regime_pct_of_min: 0.35 }  # Stricter for H4
    stage_gate:
      m30_grace_bars: 24  # Very long grace for H4 positions
