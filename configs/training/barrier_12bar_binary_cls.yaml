schema_version: "training_contract.v2.1"
contract_id: "barrier_12bar_binary_cls"

dataset:
  path: "data/training/train.npz"
  feature_schema: "v9_institutional_40"
  min_samples_per_class: 100
  sample_weighting: "return_magnitude"

label:
  contract_id: "label-regression-barrier-2.0.0"
  sl_atr_mult: 3.0  # FIX-20260528-013: RR=1.0 symmetric — requires p_win>50% for +EV
  tp_atr_mult: 1.5
  horizon_bars: 12
  profitability_calibrated: true
  label_mapping: "drop_timeout_binary"
  spread_points: 30
  slippage_points: 10
  tick_size: 0.001
  tick_value: 0.01

architecture:
  type: "lightgbm"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 20
    lambda_l1: 0.1
    lambda_l2: 0.1

validation:
  method: "cpcv"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5

quality_gates:
  model_type: tree
  min_train_sharpe: 0.0       # FIX-20260528-013: RR=1.0 symmetric — Stage 1 is signal generator, not standalone strategy (FIX-20260517-012 Route A)
  min_train_win_rate: 0.45    # Near-random barrier outcome expected with symmetric SL/TP
  min_sortino_ratio: 0.0
  min_calmar_ratio: 0.0
  max_vol_scaled_dd_pct: 60.0  # Wider tolerance for noisy Stage 1 predictions
  min_forward_sharpe: 0.0     # MetaFilter provides edge; Stage 1 just needs to be better than random
  min_forward_win_rate: 0.45
  max_overfit_gap: 5.0        # Higher tolerance — CPCV gap inflated by near-zero denominator
  require_shap_stability: false

output:
  brain_id_template: "lgb_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
