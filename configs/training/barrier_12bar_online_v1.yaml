schema_version: training_contract.v2.1
contract_id: barrier_12bar_online_v1
dataset:
  path: data/training/calibrated_12bar_v3/train.npz
  feature_schema: v9_institutional_40
  min_samples_per_class: 100
  sample_weighting: return_magnitude
label:
  contract_id: barrier_12bar_calibrated
  sl_atr_mult: 3.0
  tp_atr_mult: 1.5
  horizon_bars: 12
  profitability_calibrated: true
  spread_pips: 30
  slippage_pips: 10
  pip_value: 0.01
architecture:
  type: online_mlp
  objective_function: multi_logloss
  search_space: default
  optuna_trials: 20
  n_seeds: 3
  custom_params:
    epochs: 50
    lr: 0.001
    batch_size: 64
    n_features: 40
    n_classes: 2
validation:
  method: cpcv
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5
  val_ratio: 0.15
  test_ratio: 0.1
quality_gates:
  model_type: online
  min_train_sharpe: 0.4
  min_train_win_rate: 0.45
  min_sortino_ratio: 0.5
  min_calmar_ratio: 0.2
  max_vol_scaled_dd_pct: 40.0
  min_forward_sharpe: 0.4
  min_forward_win_rate: 0.45
  max_overfit_gap: 0.6
  require_shap_stability: false
output:
  brain_id_template: online_{contract}_{timestamp}
  model_dir: data/models/institutional
  config_dir: configs/brains
  registry_db: data/training/registry.db
  auto_register: true
  initial_status: shadow
