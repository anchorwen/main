schema_version: "training_contract.v2.1"
contract_id: "brain_trend_m30_v1"

dataset:
  path: "data/training/swing_m30_enhanced_sl1p5_tp2p5/train.npz"
  feature_schema: "swing_enhanced_35"
  min_samples_per_class: 50
  sample_weighting: "return_magnitude"

label:
  contract_id: "label-trend-1.0.0"
  sl_atr_mult: 1.5
  tp_atr_mult: 2.5
  horizon_bars: 12
  profitability_calibrated: false
  label_mapping: drop_timeout_binary

architecture:
  type: "xgboost"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1.0
    reg_lambda: 1.0

validation:
  method: "purged_wfo"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5
  val_ratio: 0.0
  test_ratio: 0.0

quality_gates:
  min_train_sharpe: 0.3
  min_train_win_rate: 0.45
  min_sortino_ratio: 1.0
  min_calmar_ratio: 0.5
  max_vol_scaled_dd_pct: 25.0
  model_type: tree
  min_forward_sharpe: 0.1
  min_forward_win_rate: 0.45
  max_overfit_gap: 5.0
  require_shap_stability: false

output:
  brain_id_template: "Brain_Trend_M30_V2"
  model_dir: "data/models/brains"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
