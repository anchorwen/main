schema_version: "training_contract.v2.1"
contract_id: "meta_stage2_mlp"

dataset:
  path: "data/training/meta_features_runtime.npz"
  feature_schema: "meta_stage2_runtime_47"
  min_samples_per_class: 100
  sample_weighting: "inverse_class_frequency"

label:
  contract_id: "label-meta-stage2-binary-1.0.0"
  sl_atr_mult: 2.0
  tp_atr_mult: 3.5
  horizon_bars: 12
  profitability_calibrated: true
  spread_pips: 0.3
  slippage_pips: 1.0
  pip_value: 0.01

architecture:
  type: "online_mlp"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 3
  custom_params:
    hidden_dim: 32
    n_hidden_layers: 2
    learning_rate: 0.001
    batch_size: 64
    n_epochs: 200
    early_stopping_rounds: 20
    dropout: 0.1
    weight_decay: 0.0001

validation:
  method: "cpcv"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5

quality_gates:
  min_train_sharpe: 0.4
  min_train_win_rate: 0.48
  min_sortino_ratio: 0.2
  min_calmar_ratio: 0.15
  max_vol_scaled_dd_pct: 45.0
  model_type: mlp
  min_forward_sharpe: 0.2
  min_forward_win_rate: 0.48
  max_overfit_gap: 1.5
  require_shap_stability: false

output:
  brain_id_template: "Meta_Stage2_MLP_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
