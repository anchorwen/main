schema_version: "training_contract.v2.1"
contract_id: "barrier_12bar_meta_binary_cls"

dataset:
  path: "data/training/meta_labeling_barrier/all.npz"
  feature_schema: "v9_institutional_40"
  min_samples_per_class: 20
  sample_weighting: "return_magnitude"

label:
  contract_id: "label-barrier-meta-1.0.0"
  sl_atr_mult: 3.0
  tp_atr_mult: 1.5
  horizon_bars: 12
  profitability_calibrated: true
  label_mapping: "drop_timeout_binary"
  spread_points: 30
  slippage_points: 10
  tick_size: 0.001
  tick_value: 0.01

architecture:
  type: "lightgbm"
  objective_function: "binary_logloss"
  search_space: "none"
  optuna_trials: 0
  n_seeds: 5
  custom_params:
    num_leaves: 7
    max_depth: 2
    learning_rate: 0.02
    feature_fraction: 0.6
    bagging_fraction: 0.6
    bagging_freq: 3
    min_data_in_leaf: 30
    lambda_l1: 1.0
    lambda_l2: 1.0

validation:
  method: "cpcv"
  n_groups: 5
  n_test_groups: 1
  purge_bars: 12
  embargo_bars: 5

quality_gates:
  model_type: tree
  min_train_sharpe: 0.0
  min_train_win_rate: 0.50
  min_sortino_ratio: 0.0
  min_calmar_ratio: 0.0
  max_vol_scaled_dd_pct: 50.0
  min_forward_sharpe: 0.0
  min_forward_win_rate: 0.50
  max_overfit_gap: 8.0
  require_shap_stability: false

output:
  brain_id_template: "lgb_meta_barrier_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
