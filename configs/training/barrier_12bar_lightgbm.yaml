schema_version: "training_contract.v2.1"
contract_id: "barrier_12bar_lightgbm_v2"

dataset:
  path: "data/training/train.npz"
  feature_schema: "v9_institutional_40"
  min_samples_per_class: 100
  sample_weighting: "return_magnitude"

label:
  contract_id: "calibrated-barrier-3.0-1.0"
  sl_atr_mult: 3.0  # FIX-20260528-013: RR=1.0 symmetric
  tp_atr_mult: 1.5  # FIX-20260528-013: RR=1.0 symmetric
  horizon_bars: 12
  profitability_calibrated: true
  label_mapping: drop_timeout_binary

architecture:
  type: "lightgbm"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 20
    lambda_l1: 0.1
    lambda_l2: 0.1

validation:
  method: "cpcv"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5

quality_gates:
  min_train_sharpe: 1.0
  min_train_win_rate: 0.50
  min_sortino_ratio: 1.0
  min_calmar_ratio: 0.5
  max_vol_scaled_dd_pct: 25.0
  model_type: tree
  min_forward_sharpe: 1.0
  min_forward_win_rate: 0.50
  max_overfit_gap: 0.30
  require_shap_stability: true

output:
  brain_id_template: "lgb_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
