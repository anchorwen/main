schema_version: "training_contract.v2.1"
contract_id: "daily_swing_xgboost_v1"

dataset:
  path: "data/training/d1_swing_5d.npz"
  feature_schema: "daily_swing_22"
  min_samples_per_class: 50
  sample_weighting: "return_magnitude"

label:
  contract_id: "d1-swing-5d-barrier-1.0.0"
  sl_atr_mult: 2.0
  tp_atr_mult: 3.0
  horizon_bars: 5

architecture:
  type: "xgboost"
  objective_function: "custom_sharpe"
  search_space: "default"
  optuna_trials: 30
  n_seeds: 5
  custom_params:
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

validation:
  method: "cpcv"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 5
  embargo_bars: 2

quality_gates:
  min_train_sharpe: 1.0
  min_train_win_rate: 0.50
  min_sortino_ratio: 1.0
  min_calmar_ratio: 0.5
  max_vol_scaled_dd_pct: 25.0
  model_type: tree
  min_forward_sharpe: 1.0
  min_forward_win_rate: 0.50
  max_overfit_gap: 0.30
  require_shap_stability: true

output:
  brain_id_template: "xgb_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
