schema_version: "training_contract.v2.1"
contract_id: "meta_stage2_lightgbm_v2"

dataset:
  path: "data/training/meta_features_runtime_v2.npz"
  feature_schema: "meta_stage2_runtime_47"  # FIX-20260528-013: rebuilt with 40 V9 + 7 PiT meta
  min_samples_per_class: 100
  sample_weighting: "inverse_class_frequency"

label:
  contract_id: "label-meta-stage2-binary-1.0.0"
  sl_atr_mult: 2.0
  tp_atr_mult: 3.5
  horizon_bars: 12
  profitability_calibrated: true
  label_mapping: null  # FIX-20260528-013: dataset already has binary {0,1} from build_meta_features.py
  spread_points: 30
  slippage_points: 10
  tick_size: 0.001
  tick_value: 0.01

architecture:
  type: "lightgbm"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 20
    lambda_l1: 0.1
    lambda_l2: 0.1
    # FIX-20260528-013: scale_pos_weight removed — balanced classes with RR=1.0.
    # inverse_class_frequency sample_weighting handles any residual imbalance.

validation:
  method: "cpcv"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5

quality_gates:
  min_train_sharpe: 0.5
  min_train_win_rate: 0.48
  min_sortino_ratio: 0.3
  min_calmar_ratio: 0.2
  max_vol_scaled_dd_pct: 40.0
  model_type: tree
  min_forward_sharpe: 0.3
  min_forward_win_rate: 0.48
  max_overfit_gap: 5.0  # FIX-20260528-013: RR=1.0 MetaFilter has high train/forward Sharpe, gap scales with magnitude
  require_shap_stability: false

output:
  brain_id_template: "Meta_Stage2_Filter_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
