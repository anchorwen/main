schema_version: training_contract.v2.1
contract_id: barrier_daily_deepresmlp_v1
dataset:
  path: data/training/calibrated_24bar_v2/train.npz
  feature_schema: v9_institutional_40
  min_samples_per_class: 100
  sample_weighting: return_magnitude
label:
  contract_id: barrier_daily_calibrated
  sl_atr_mult: 3.0
  tp_atr_mult: 1.5
  horizon_bars: 24
  profitability_calibrated: true
  # label_mapping not needed — dataset already in binary {0,1} format
  spread_points: 30
  slippage_points: 10
  tick_size: 0.001
  tick_value: 0.01
architecture:
  type: deep_res_mlp
  objective_function: binary_logloss
  search_space: default
  optuna_trials: 30
  n_seeds: 3
  custom_params:
    epochs: 200
    lr: 0.0003
    batch_size: 128
    dropout: 0.2
    weight_decay: 0.0001
    regression: false
validation:
  method: cpcv
  n_groups: 6
  n_test_groups: 2
  purge_bars: 24
  embargo_bars: 12
  val_ratio: 0.15
  test_ratio: 0.1
quality_gates:
  model_type: deep_learning
  min_train_sharpe: 0.5
  min_train_win_rate: 0.46
  min_sortino_ratio: 0.7
  min_calmar_ratio: 0.3
  max_vol_scaled_dd_pct: 35.0
  min_forward_sharpe: 0.5
  min_forward_win_rate: 0.46
  max_overfit_gap: 0.5
  require_shap_stability: false
output:
  brain_id_template: deepresmlp_{contract}_{timestamp}
  model_dir: data/models/institutional
  config_dir: configs/brains
  registry_db: data/training/registry.db
  auto_register: true
  initial_status: shadow
