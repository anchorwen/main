schema_version: "training_contract.v2.1"
contract_id: "barrier_12bar_regression_huber_v9micro"

dataset:
  path: "data/training/v9_micro_49_train.npz"
  feature_schema: "v9_micro_49"
  min_samples_per_class: 100
  sample_weighting: "return_magnitude"

label:
  contract_id: "label-regression-barrier-2.0.0"
  sl_atr_mult: 2.0
  tp_atr_mult: 3.5
  horizon_bars: 12
  profitability_calibrated: false
  spread_pips: 0.3
  slippage_pips: 1.0
  pip_value: 0.01

architecture:
  type: "lightgbm"
  objective_function: "reg_huber"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 20
    lambda_l1: 0.1
    lambda_l2: 0.1
    huber_delta: 1.0

validation:
  method: "cpcv"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 12
  embargo_bars: 5

quality_gates:
  min_train_sharpe: 0.75
  min_train_win_rate: 0.48
  min_sortino_ratio: 0.5
  min_calmar_ratio: 0.3
  max_vol_scaled_dd_pct: 30.0
  model_type: tree
  min_forward_sharpe: 0.75
  min_forward_win_rate: 0.48
  max_overfit_gap: 1.0
  require_shap_stability: true

output:
  brain_id_template: "lgb_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
