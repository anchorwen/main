schema_version: "training_contract.v2.1"
contract_id: "m15_swing_xgboost_v1"

dataset:
  path: "data/training/m15_swing_24bar.npz"
  feature_schema: "swing_24"
  min_samples_per_class: 100
  sample_weighting: "return_magnitude"

label:
  contract_id: "swing-barrier-m15-24bar"
  sl_atr_mult: 2.0
  tp_atr_mult: 2.0
  horizon_bars: 24

architecture:
  type: "xgboost"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1.0
    reg_lambda: 1.0
    reg_alpha: 0.0
    gamma: 0.0

validation:
  method: "purged_wfo"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 24
  embargo_bars: 5
  val_ratio: 0.0
  test_ratio: 0.0

quality_gates:
  min_train_sharpe: 0.3
  min_train_win_rate: 0.45
  min_sortino_ratio: 1.0
  min_calmar_ratio: 0.5
  max_vol_scaled_dd_pct: 25.0
  model_type: tree
  min_forward_sharpe: 0.1
  min_forward_win_rate: 0.45
  max_overfit_gap: 5.00
  require_shap_stability: false

output:
  brain_id_template: "xgb_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
