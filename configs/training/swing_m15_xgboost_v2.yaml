schema_version: training_contract.v2.1
contract_id: swing_m15_xgboost_v2
dataset:
  path: data/training/calibrated_24bar_m15_v1/train.npz
  feature_schema: swing_24
  min_samples_per_class: 100
  sample_weighting: return_magnitude
label:
  contract_id: swing_m15_calibrated
  sl_atr_mult: 3.0
  tp_atr_mult: 1.5
  horizon_bars: 24
  profitability_calibrated: true
  spread_pips: 30
  slippage_pips: 10
  pip_value: 0.01
architecture:
  type: xgboost
  objective_function: binary_logloss
  search_space: default
  optuna_trials: 50
  n_seeds: 5
  custom_params:
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1.0
    reg_lambda: 1.0
validation:
  method: purged_wfo
  n_groups: 5
  n_test_groups: 1
  purge_bars: 24
  embargo_bars: 12
  val_ratio: 0.0
  test_ratio: 0.0
quality_gates:
  model_type: tree
  min_train_sharpe: 0.75
  min_train_win_rate: 0.48
  min_sortino_ratio: 1.0
  min_calmar_ratio: 0.5
  max_vol_scaled_dd_pct: 25.0
  min_forward_sharpe: 0.75
  min_forward_win_rate: 0.48
  max_overfit_gap: 0.3
  require_shap_stability: false
output:
  brain_id_template: xgb_{contract}_{timestamp}
  model_dir: data/models/institutional
  config_dir: configs/brains
  registry_db: data/training/registry.db
  auto_register: true
  initial_status: shadow
