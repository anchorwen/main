schema_version: "training_contract.v2.1"
contract_id: "h4_swing_lightgbm_v1"

dataset:
  path: "data/training/h4_swing_18bar.npz"
  feature_schema: "swing_24"
  min_samples_per_class: 100
  sample_weighting: "return_magnitude"

label:
  contract_id: "swing-barrier-h4-18bar"
  sl_atr_mult: 2.0
  tp_atr_mult: 2.0
  horizon_bars: 18
  profitability_calibrated: false
  label_mapping: drop_timeout_binary

architecture:
  type: "lightgbm"
  objective_function: "binary_logloss"
  search_space: "default"
  optuna_trials: 20
  n_seeds: 3
  custom_params:
    num_leaves: 7
    learning_rate: 0.02
    feature_fraction: 0.6
    bagging_fraction: 0.6
    bagging_freq: 3
    min_data_in_leaf: 50
    lambda_l1: 1.0
    lambda_l2: 5.0

validation:
  method: "purged_wfo"
  n_groups: 6
  n_test_groups: 2
  purge_bars: 18
  embargo_bars: 5
  val_ratio: 0.0
  test_ratio: 0.0

quality_gates:
  min_train_sharpe: 0.3
  min_train_win_rate: 0.45
  min_sortino_ratio: 1.0
  min_calmar_ratio: 0.5
  max_vol_scaled_dd_pct: 25.0
  model_type: tree
  min_forward_sharpe: 0.1
  min_forward_win_rate: 0.45
  max_overfit_gap: 6.00
  require_shap_stability: false

output:
  brain_id_template: "lgb_{contract}_{timestamp}"
  model_dir: "data/models/institutional"
  config_dir: "configs/brains"
  registry_db: "data/training/registry.db"
  auto_register: false
  initial_status: "shadow"
