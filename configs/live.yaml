schema_version: live_config.v2
description: Quant OS live & shadow unified configuration
adapter:
  name: mt5
fix:
  sender_comp_id: ''
  target_comp_id: ''
  venue: FIX_LIVE
mt5:
  terminal_path: D:\MetaTrader 5\terminal64.exe
  default_symbol: XAUUSDc
  normalization_config: configs/brains/v9_institutional_01.normalization.json
features:
  store_dir: data/feature_store
  update_interval_seconds: 60
brains:
  # registry_entries: optional allowlist (deprecated as mandatory).
  # When empty or absent, all brain_registry_entry.v1 JSON files in
  # configs/brains/ are auto-discovered by BrainRegistry at startup.
  # Listing entries here acts as an allowlist: only listed brains are
  # active.  Use 'scripts/brain.py register' to add entries.
  registry_entries:
  - path: configs/brains/ou_params_v6.json
    enabled: true
  - path: configs/brains/ou_params_v7_m15.json
    enabled: true
  - path: configs/brains/meta_stage1_huber_v1.json
    enabled: false  # FROZEN 2026-05-24: SL=2.0/TP=3.5 unprofitable with corrected costs (30pt spread/10pt slippage). Regression approach collapsed — replaced by binary classifier.
  - path: configs/brains/meta_stage1_binary_cls_v1.json
    enabled: true   # NEW 2026-05-24: Binary classifier (drop-timeout), SL=3.0/TP=1.5, Stage 1 Sharpe 8.5, Stage 2 LGB Sharpe 43.3. Shadow mode — monitoring before live voting.
  - path: configs/brains/meta_stage1_metalabel_binary_v1.json
    enabled: true   # NEW 2026-05-24: Meta-Labeling binary classifier. OU signal (z_entry=1.3) → barrier SL=3.0/TP=1.5. 43-dim (40 V9 + 3 OU). PIT-aligned. Contract group: barrier_12bar_meta. Shadow mode — deployment requires OU signal engine integration.
  # ── V9 barrier classifier brains DELETED 2026-05-21 ──
  # xgb_barrier_12bar_xgboost_v3: blind OOS WR 39.6%, Total PnL -714R — anti-predictive
  # lgb_barrier_12bar_lightgbm_v3: blind OOS WR 34.9%, Total PnL -1211R — anti-predictive
  # Root cause: unconditional P(TP|Features) on every M5 bar = pure noise
  # Strategic pivot: Huber regression probe (Meta_Stage1_Huber_V1) as sole barrier_12bar voter
  # Status: probation — live voting with PnL monitoring, auto-retire if Sharpe < 0 for 30+ days
  # ── Online learner excluded from live voting ──
  # Online_MLP_V1: not yet validated for live voting — insufficient OOS trade history
  # To activate: add `- path: configs/brains/online_learner_v1.json` with `enabled: true`
gate:
  gate_policy_config: configs/live_gate_policy.json
  auto_recovery:
    enabled: false
    consecutive_pass_cycles: 5
pipeline:
  staging_dir: data/staging
  data_dir: data
  default_mode: shadow
training:
  plan_generator: scripts/training/generate_batch_plan.py
  lanes_config: scripts/training/lane_trainers.json
  sur:
    trainer_root: data/training/sur_v9
    dataset_csv: data/training/sur_v9/V9_Symbiosis_Matrix.csv
  arb:
    trainer_root: data/training/arb_v6
    dataset_csv: data/training/arb_v6/Exness_XAUUSDm_2026_04.csv
  mtx:
    trainer_root: data/training/mtx_v4.5
    dataset_csv: data/training/mtx_v4.5/Exness_XAUUSDm_2026_04.csv
live_trading:
  mt5_terminal_path: D:\MetaTrader 5\terminal64.exe
  symbol: XAUUSDc
  volume: 0.01
  interval_seconds: 60
  confidence_threshold: 0.25
  risk_budget_usd: 30.0
  equity_risk_pct: 0.0
  min_lot: 0.01
  max_lot: 0.1
  lot_step: 0.01
  intraday_drawdown_kill:
    enabled: true
    kill_pct: 0.02
    reset_hour_utc: 0
  sl_atr_mult: 2.0
  tp_atr_mult: 3.5
  cooldown_seconds: 300
  max_positions: 3
  multi_brain: true
  brains_dir: configs/brains
  normalization_config: configs/brains/v9_institutional_01.normalization.json
  feature_store_dir: data/feature_store
  bridge:
    poll_seconds: 3
    deviation: 20
    magic: 90001
  base_dir: data
  bar_sync: true
  bar_sync_timeout: 360
  use_exit_watchdog: true
  use_limit_orders: true
exit_management:
  enabled: true
  trail_atr_mult: 2.0
  trail_atr_mult_low: 1.5
  trail_atr_mult_high: 3.0
  breakeven_threshold_atr: 1.5
  brain_reeval_interval: 5
  flip_exit_threshold: 0.5
  confidence_drop_threshold: 0.1
  max_hold_cycles: 60
  require_min_r: 0.3
  min_sl_step: 0.15
capital_allocator:
  base_volume: 0.01
  min_volume: 0.01
  max_volume: 0.1
  require_unanimous: false
  regime:
    low_vol_mult: 1.2
    normal_mult: 1.0
    high_vol_mult: 0.7
  vol_reference_atr: 5.0
meta_exit:
  model_path: data/models/meta_exit_model.txt
  urgency_threshold: 0.65
  factor_weights:
    pnl: 0.3
    time: 0.2
    regime: 0.15
    consensus: 0.25
    volatility: 0.1
correlation_tracker:
  ema_alpha: 0.05
  min_updates: 3
strategy_lines:
  barrier_12bar:
    enabled: true
    # ── DORMANT 2026-05-24: Meta_Stage1_Huber_V1 frozen (The Great Reset) ──
    # SL=3.0/TP=1.5 retrained contract. Meta_Stage1_Binary_Cls_V1 active
    # as lightgbm_v1 but vote_weight=0.0 (shadow monitoring — OOF bimodal,
    # not safe for live voting). Strategy reactivates when a voting brain
    # passes quality gates or Binary_Cls_V1 OOF distribution is fixed.
    mode: shadow  # SHADOW-ONLY: zero real capital, BPS prediction logging only
    timeframe: M5
    magic: 90001
    min_valid_brains: 1  # Huber regression probe as sole voter (V9 classifiers purged)
    confidence_threshold: 0.40  # Dictator Protocol: single-brain Huber probe. Lowered from 0.75 for unblocked Track 4d delivery.
    brain_types:
    - lightgbm_v1  # Meta_Stage1_Huber_V1 — regression BPS probe, not binary classifier
    base_volume: 0.0   # ZERO real capital — shadow observation only
    max_volume: 0.0    # ZERO real capital — shadow observation only
    sl:
      base_atr_mult: 3.0   # FIX-20260524-036: aligned with training contract SL=3.0 (was 2.0)
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0   # absolute floor — SL ≥$8 even when ATR collapses
      min_rr_ratio: 0.5      # TP≥0.5R when SL is floored (TP=1.5, so min RR is low)
    tp:
      base_atr_mult: 1.5   # FIX-20260524-036: aligned with training contract TP=1.5 (was 3.5)
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.0
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      trail_atr_mult_low: 1.8
      trail_atr_mult_high: 3.0
      breakeven_threshold_atr: 1.0
      flip_exit_enabled: true
      flip_threshold: 0.5
      time_exit_cycles: 60
      min_r_for_hold: 0.3
      confidence_decay_exit: true
      hesitation_cycles: 12  # 12 M5 bars = 60min = matches 12-bar training horizon
    budget:
      daily_loss_limit_pct: -0.03
      max_consecutive_losses: 5
    direction_balance:
      long_bias_discount: 0.05
  barrier_12bar_meta:
    enabled: true
    # ── NEW 2026-05-24: Meta-Labeling contract group ──
    # OU signal engine triggers candidate entries; the meta-labeling binary
    # classifier (Meta_Stage1_MetaLabel_Binary_V1) predicts P(TP|signal).
    # This is fundamentally different from barrier_12bar which predicts
    # unconditionally on every bar — here ML filters OU signals only.
    # Promoted from shadow to probation 2026-05-24: z_entry clipping [1.3, 2.5]
    # and OU feature augmentation wired in FeatureAdapter.
    mode: probation  # probation voting with live capital at small size
    timeframe: M5
    magic: 90014
    min_valid_brains: 1
    confidence_threshold: 0.40
    brain_types:
    - lightgbm_v1  # Meta_Stage1_MetaLabel_Binary_V1 — meta-labeling binary classifier
    base_volume: 0.01  # probation: minimal live capital
    max_volume: 0.01   # probation: capped at 0.01
    sl:
      base_atr_mult: 3.0
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0
      min_rr_ratio: 0.5
    tp:
      base_atr_mult: 1.5
      partial_tp_enabled: false
    exit:
      trail_enabled: false
      flip_exit_enabled: true
      flip_threshold: 0.5
      time_exit_cycles: 60
      confidence_decay_exit: true
      hesitation_cycles: 12
    budget:
      daily_loss_limit_pct: -0.03
      max_consecutive_losses: 5
    direction_balance:
      long_bias_discount: 0.05
  micro_3bar:
    enabled: false
    timeframe: M5
    magic: 90002
    brain_types:
    - xgboost_v4.5
    - transformer_v4.3
    - transformer_v5
    base_volume: 0.01
    max_volume: 0.03
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0   # absolute floor — SL ≥$8 even when ATR collapses
      min_rr_ratio: 1.5      # stretch TP to maintain ≥1.5:1 when SL is floored
    tp:
      base_atr_mult: 2.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.0
    exit:
      trail_enabled: false
      flip_exit_enabled: true
      flip_threshold: 0.45
      time_exit_cycles: 25
      hesitation_cycles: 1
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 6
    direction_balance:
      long_bias_discount: 0.03
  micro_m15:
    enabled: false
    timeframe: M15
    magic: 90101
    brain_types:
    - xgboost_v4.5_m15
    - transformer_v5_m15
    base_volume: 0.01
    max_volume: 0.03
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 2.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.0
    exit:
      trail_enabled: false
      flip_exit_enabled: true
      flip_threshold: 0.45
      time_exit_cycles: 75
      hesitation_cycles: 1
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 6
    direction_balance:
      long_bias_discount: 0.03
  micro_h1:
    enabled: false
    timeframe: H1
    magic: 90201
    brain_types:
    - xgboost_v4.5_h1
    - transformer_v5_h1
    base_volume: 0.01
    max_volume: 0.02
    sl:
      base_atr_mult: 1.8
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 2.8
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.5
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: true
      flip_threshold: 0.45
      time_exit_cycles: 240
      hesitation_cycles: 2
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.0
  statarb_dynamic:
    enabled: true
    timeframe: M5
    magic: 90003
    brain_types:
    - ou_params_v6
    base_volume: 0.02
    max_volume: 0.03
    confidence_threshold: 0.35
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0   # absolute floor — SL ≥$8 even when ATR collapses
      min_rr_ratio: 1.5      # stretch TP to maintain ≥1.5:1 when SL is floored
    tp:
      base_atr_mult: 3.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.0
    exit:
      trail_enabled: true
      trail_atr_mult: 1.5
      trail_atr_mult_low: 1.2
      trail_atr_mult_high: 2.5
      breakeven_threshold_atr: 0.8
      flip_exit_enabled: false
      time_exit_cycles: 40
      zscore_exit_enabled: true
      confidence_decay_exit: false
      hesitation_cycles: 6
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.10
  statarb_m15:
    enabled: true
    timeframe: M15
    magic: 90103
    brain_types:
    - ou_params_v6
    base_volume: 0.01
    max_volume: 0.02
    confidence_threshold: 0.3
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 4.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.5
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: false
      time_exit_cycles: 120
      zscore_exit_enabled: true
      confidence_decay_exit: false
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.01
      max_consecutive_losses: 3
    direction_balance:
      long_bias_discount: 0.0
  daily_swing:
    enabled: false  # FIX-20260523-006: graveyard cleanup — no active swing brains remain
    timeframe: D1
    magic: 90301
    brain_types:
    - xgboost_v9
    - lightgbm_v1
    base_volume: 0.01
    max_volume: 0.03
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 3.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.0
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 1440
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 3
    direction_balance:
      long_bias_discount: 0.0
  m15_swing:
    enabled: false  # FIX-20260523-006: graveyard cleanup — no active swing brains remain
    timeframe: M15
    magic: 90310
    brain_types:
    - xgboost_v9
    base_volume: 0.01
    max_volume: 0.03
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 3.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.5
    exit:
      trail_enabled: true
      trail_atr_mult: 1.5
      trail_atr_mult_low: 1.3
      trail_atr_mult_high: 2.5
      breakeven_threshold_atr: 1.2
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 72
      confidence_decay_exit: true
      min_r_for_hold: 0.15
      hesitation_cycles: 4  # 4 M15 bars = 60min — swing needs time to develop
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.0
  m30_swing:
    enabled: false  # FIX-20260523-006: graveyard cleanup — no active swing brains remain
    timeframe: M30
    magic: 90320
    brain_types:
    - xgboost_v9
    base_volume: 0.01
    max_volume: 0.03
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 3.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.5
    exit:
      trail_enabled: true
      trail_atr_mult: 1.5
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 36
      hesitation_cycles: 3  # 3 M30 bars = 90min — longer swing needs more patience
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.0
  h1_swing:
    enabled: false  # FIX-20260523-006: graveyard cleanup — no active swing brains remain
    timeframe: H1
    magic: 90330
    brain_types:
    - xgboost_v9
    - lightgbm_v1
    base_volume: 0.01
    max_volume: 0.02
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 3.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.0
    exit:
      trail_enabled: true
      trail_atr_mult: 2.5
      trail_atr_mult_low: 2.0
      trail_atr_mult_high: 3.5
      breakeven_threshold_atr: 1.5
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 288
      confidence_decay_exit: true
      min_r_for_hold: 0.0
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 3
    direction_balance:
      long_bias_discount: 0.0
  h4_swing:
    enabled: false  # Wave D: 100% short bias — macro-bias overfitting, shadow until retrained
    timeframe: H4
    magic: 90340
    brain_types:
    - xgboost_v9
    base_volume: 0.01
    max_volume: 0.02
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 4.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.5
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 864
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 2
    direction_balance:
      long_bias_discount: 0.0
portfolio_risk:
  max_gross_exposure: 0.1
  max_net_exposure: 0.05
  max_same_direction_strategies: 2
  netting_mode: net_out
  execution_stagger_seconds: 20
regime_gate:
  adx:
    trending_threshold: 30
    mild_trend_threshold: 20
  atr_percentile:
    high_vol_threshold: 80
    low_vol_threshold: 20
  regime_map:
    trending:
      barrier_12bar: full
      barrier_12bar_meta: reduced
      micro_3bar: reduced
      micro_m15: reduced
      micro_h1: full
      statarb_dynamic: false
      statarb_m15: false
    mild_trend:
      barrier_12bar: full
      barrier_12bar_meta: reduced
      micro_3bar: full
      micro_m15: full
      micro_h1: full
      statarb_dynamic: reduced
      statarb_m15: reduced
    ranging:
      barrier_12bar: reduced
      barrier_12bar_meta: full
      micro_3bar: reduced
      micro_m15: reduced
      micro_h1: reduced
      statarb_dynamic: full
      statarb_m15: full
    high_vol:
      barrier_12bar: false
      barrier_12bar_meta: reduced
      micro_3bar: full
      micro_m15: full
      micro_h1: reduced
      statarb_dynamic: reduced
      statarb_m15: reduced
    normal:
      barrier_12bar: full
      barrier_12bar_meta: full
      micro_3bar: full
      micro_m15: full
      micro_h1: full
      statarb_dynamic: full
      statarb_m15: full
shadow:
  shadow_config: configs/live_shadow_config.json
  compare_report_dir: reports/shadow_compare
healthcheck:
  enabled: true
  check_interval_minutes: 15
  components:
  - name: data_freshness
    max_staleness_sec: 300
  - name: signal_heartbeat
    max_staleness_sec: 60
  - name: mt5_connection
    symbol: XAUUSDc
  - name: journal_health
    max_consecutive_rejects: 3
