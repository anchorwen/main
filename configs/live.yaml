live_trading:
  mt5_terminal_path: D:\exness\MetaTrader 5 EXNESS2\terminal64.exe
  symbol: XAUUSDc
  volume: 0.01
  interval_seconds: 60
  confidence_threshold: 0.25
  risk_budget_usd: 30.0
  equity_risk_pct: 0.0
  min_lot: 0.01
  max_lot: 0.1
  lot_step: 0.01
  # ── FIX-20260629-188 (P1-3): Block new entries during loss-making hours ──
  # 00:00-01:00 UTC: -$44.32 (20 trades, avg -$2.22) — Asian rollover
  # 20:00-21:00 UTC: -$43.83 (14 trades, avg -$3.13) — Pre-Asian open
  # These 2 hours = -$88.15 of -$89.03 total XAU swing PnL (n=506)
  blocked_entry_hours: [0, 20]
  intraday_drawdown_kill:
    enabled: true
    kill_pct: 0.02
    reset_hour_utc: 0
  sl_atr_mult: 2.0
  tp_atr_mult: 3.5
  cooldown_seconds: 300
  max_positions: 3
  multi_brain: true
  brains_dir: configs/brains
  normalization_config: configs/brains/v9_institutional_01.normalization.json
  feature_store_dir: data/feature_store
  bridge:
    poll_seconds: 3
    deviation: 20
    magic: 90001
  base_dir: data
  bar_sync: true
  bar_sync_timeout: 360
  use_exit_watchdog: true
  use_limit_orders: true
exit_management:
  enabled: true
  trail_atr_mult: 2.0
  trail_atr_mult_low: 1.5
  trail_atr_mult_high: 3.0
  breakeven_threshold_atr: 1.5
  brain_reeval_interval: 5
  flip_exit_threshold: 0.5
  confidence_drop_threshold: 0.1
  max_hold_cycles: 60
  require_min_r: 0.3
  min_sl_step: 0.15
reentry:
  sl_cooldown_seconds: 180
  sl_confidence_penalty: 0.1
  bleed_cooldown_seconds: 180
  bleed_confidence_penalty: 0.1
alert:
  enabled: true
  thresholds:
    daily_loss_limit: -5.0
    consecutive_losers: 8
    win_rate_collapse: 0.3
    strategy_degradation_loss: -3.0
    strategy_degradation_wr: 0.3
  channels:
    slack: true
    dingtalk: true
    dingtalk_webhook_url: https://oapi.dingtalk.com/robot/send?access_token=f33f64c01a0323ee7859fab62495addd0ad75c02182425f91b5ffe4ffbf9ce46
    log: true
alert_system:
  rules:
  - id: RULE-001
    name: high_error_rate
    context_key: error_rate
    operator: gt
    threshold: 0.1
    severity: critical
    cooldown_seconds: 60
  - id: RULE-002
    name: circuit_breaker_open
    context_key: circuit_state
    operator: eq
    threshold: open
    severity: critical
    cooldown_seconds: 120
  - id: RULE-003
    name: bridge_heartbeat_missed
    context_key: bridge_last_ack_seconds
    operator: gt
    threshold: 120
    severity: critical
    cooldown_seconds: 120
  - id: RULE-004
    name: brain_frozen
    context_key: frozen_brain_count
    operator: gt
    threshold: 0
    severity: warning
    cooldown_seconds: 600
  - id: RULE-005
    name: position_limit_near
    context_key: position_utilization
    operator: gt
    threshold: 0.8
    severity: warning
    cooldown_seconds: 300
  - id: RULE-006
    name: cycle_stall
    context_key: cycle_duration_seconds
    operator: gt
    threshold: 180
    severity: critical
    cooldown_seconds: 300
  - id: RULE-007
    name: daily_loss_exceeded
    context_key: daily_pnl_usd
    operator: lt
    threshold: -5.0
    severity: critical
    cooldown_seconds: 300
  - id: RULE-008
    name: consecutive_losses
    context_key: consecutive_losses
    operator: gt
    threshold: 8
    severity: warning
    cooldown_seconds: 600
  - id: RULE-009
    name: win_rate_collapse
    type: composite
    composite_kind: win_rate_collapse
    threshold: 0.3
    min_window: 20
    severity: critical
    cooldown_seconds: 600
  - id: RULE-010
    name: strategy_degradation
    type: composite
    composite_kind: strategy_degradation
    wr_threshold: 0.3
    pnl_threshold: -3.0
    severity: warning
    cooldown_seconds: 1800
  - id: RULE-011
    name: high_throttle_rate
    context_key: throttle_rate
    operator: gt
    threshold: 0.3
    severity: warning
    cooldown_seconds: 300
