schema_version: live_config.v2
description: Quant OS live & shadow unified configuration
adapter:
  name: mt5
fix:
  sender_comp_id: ''
  target_comp_id: ''
  venue: FIX_LIVE
mt5:
  terminal_path: D:\MetaTrader 5\terminal64.exe
  default_symbol: XAUUSDc
  normalization_config: configs/brains/v9_institutional_01.normalization.json
features:
  store_dir: data/feature_store
  update_interval_seconds: 60
brains:
  registry_entries:
  - path: configs/brains/OU_Params_V6_Sniper.json
    enabled: true
  - path: configs/brains/OU_Params_V7_M15.json
    enabled: true
  - path: configs/brains/Meta_Stage1_Huber_V1.json
    enabled: false
  - path: configs/brains/Meta_Stage1_Binary_Cls_V1.json
    enabled: true
  - path: configs/brains/Meta_Stage1_MetaLabel_Binary_V1.json
    enabled: true
  # Swing_V9 V1 configs archived to archive_deprecated/ (FIX-20260529-034: magic collision resolution)
  - path: configs/brains/Swing_V9_M30_V2.json
    enabled: true
  - path: configs/brains/Swing_V9_M15_V2.json
    enabled: true
gate:
  gate_policy_config: configs/live_gate_policy.json
  auto_recovery:
    enabled: false
    consecutive_pass_cycles: 5
pipeline:
  staging_dir: data/staging
  data_dir: data
  default_mode: shadow
training:
  plan_generator: scripts/training/generate_batch_plan.py
  lanes_config: scripts/training/lane_trainers.json
  sur:
    trainer_root: data/training/sur_v9
    dataset_csv: data/training/sur_v9/V9_Symbiosis_Matrix.csv
  arb:
    trainer_root: data/training/arb_v6
    dataset_csv: data/training/arb_v6/Exness_XAUUSDm_2026_04.csv
  mtx:
    trainer_root: data/training/mtx_v4.5
    dataset_csv: data/training/mtx_v4.5/Exness_XAUUSDm_2026_04.csv
live_trading:
  mt5_terminal_path: D:\MetaTrader 5\terminal64.exe
  symbol: XAUUSDc
  volume: 0.01
  interval_seconds: 60
  confidence_threshold: 0.25
  risk_budget_usd: 30.0
  equity_risk_pct: 0.0
  min_lot: 0.01
  max_lot: 0.1
  lot_step: 0.01
  intraday_drawdown_kill:
    enabled: true
    kill_pct: 0.02
    reset_hour_utc: 0
  sl_atr_mult: 2.0
  tp_atr_mult: 3.5
  cooldown_seconds: 300
  max_positions: 3
  multi_brain: true
  brains_dir: configs/brains
  normalization_config: configs/brains/v9_institutional_01.normalization.json
  feature_store_dir: data/feature_store
  bridge:
    poll_seconds: 3
    deviation: 20
    magic: 90001
  base_dir: data
  bar_sync: true
  bar_sync_timeout: 360
  use_exit_watchdog: true
  use_limit_orders: true
exit_management:
  enabled: true
  trail_atr_mult: 2.0
  trail_atr_mult_low: 1.5
  trail_atr_mult_high: 3.0
  breakeven_threshold_atr: 1.5
  brain_reeval_interval: 5
  flip_exit_threshold: 0.5
  confidence_drop_threshold: 0.1
  max_hold_cycles: 60
  require_min_r: 0.3
  min_sl_step: 0.15
alert:
  # Phase A: LiveAlertHub wiring (FIX-20260529-040)
  # Controls the 6-layer alert pipeline: rules → circuit breaker → Slack/DingTalk/Log
  enabled: true   # LiveAlertHub active (FIX-20260529-040): DingTalk webhook configured
  thresholds:
    daily_loss_limit: -5.0          # USD, trip circuit breaker when daily realized PnL exceeds
    consecutive_losers: 8           # warning when consecutive losses exceed this
    win_rate_collapse: 0.30         # trip circuit breaker when rolling 100-trade WR drops below
    strategy_degradation_loss: -3.0 # warning when single-strategy PnL drops below
    strategy_degradation_wr: 0.30   # warning when single-strategy WR drops below
  channels:
    slack: true                     # enable Slack (requires QUANTOS_SLACK_WEBHOOK_URL)
    dingtalk: true                  # enable DingTalk
    dingtalk_webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=f33f64c01a0323ee7859fab62495addd0ad75c02182425f91b5ffe4ffbf9ce46"
    log: true                       # always enabled (writes to data/logs/alert_audit.jsonl)
capital_allocator:
  base_volume: 0.01
  min_volume: 0.01
  max_volume: 0.1
  require_unanimous: false
  regime:
    low_vol_mult: 1.2
    normal_mult: 1.0
    high_vol_mult: 0.7
  vol_reference_atr: 5.0
meta_exit:
  model_path: data/models/meta_exit_model.txt
  urgency_threshold: 0.65
  factor_weights:
    pnl: 0.3
    time: 0.2
    regime: 0.15
    consensus: 0.25
    volatility: 0.1
correlation_tracker:
  ema_alpha: 0.05
  min_updates: 3
strategy_lines:
  barrier_12bar:
    enabled: false
    mode: probation
    timeframe: M5
    magic: 90001
    strategy_family: trend_following
    min_valid_brains: 1
    confidence_threshold: 0.4
    brain_types:
    - lightgbm_v1
    base_volume: 0.01
    max_volume: 0.01
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0
      min_rr_ratio: 1.0
    tp:
      base_atr_mult: 1.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.0
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      trail_atr_mult_low: 1.8
      trail_atr_mult_high: 3.0
      breakeven_threshold_atr: 1.0
      flip_exit_enabled: true
      flip_threshold: 0.5
      time_exit_cycles: 60
      min_r_for_hold: 0.3
      confidence_decay_exit: true
      hesitation_cycles: 12
    budget:
      daily_loss_limit_pct: -0.03
      max_consecutive_losses: 5
    direction_balance:
      long_bias_discount: 0.05
  barrier_12bar_meta:
    enabled: false
    mode: probation
    timeframe: M5
    magic: 90014
    strategy_family: trend_following
    min_valid_brains: 1
    confidence_threshold: 0.4
    brain_types:
    - lightgbm_v1
    base_volume: 0.01
    max_volume: 0.01
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 3.0
      min_rr_ratio: 1.0
    tp:
      base_atr_mult: 1.5
      partial_tp_enabled: false
    exit:
      trail_enabled: false
      flip_exit_enabled: true
      flip_threshold: 0.5
      time_exit_cycles: 60
      confidence_decay_exit: true
      hesitation_cycles: 12
    budget:
      daily_loss_limit_pct: -0.03
      max_consecutive_losses: 5
    direction_balance:
      long_bias_discount: 0.05
  micro_3bar:
    enabled: false
    timeframe: M5
    magic: 90002
    brain_types:
    - xgboost_v4.5
    - transformer_v4.3
    - transformer_v5
    base_volume: 0.01
    max_volume: 0.03
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0
      min_rr_ratio: 1.5
    tp:
      base_atr_mult: 2.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.0
    exit:
      trail_enabled: false
      flip_exit_enabled: true
      flip_threshold: 0.45
      time_exit_cycles: 25
      hesitation_cycles: 1
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 6
    direction_balance:
      long_bias_discount: 0.03
  micro_m15:
    enabled: false
    timeframe: M15
    magic: 90101
    brain_types:
    - xgboost_v4.5_m15
    - transformer_v5_m15
    base_volume: 0.01
    max_volume: 0.03
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 2.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.0
    exit:
      trail_enabled: false
      flip_exit_enabled: true
      flip_threshold: 0.45
      time_exit_cycles: 75
      hesitation_cycles: 1
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 6
    direction_balance:
      long_bias_discount: 0.03
  micro_h1:
    enabled: false
    timeframe: H1
    magic: 90201
    brain_types:
    - xgboost_v4.5_h1
    - transformer_v5_h1
    base_volume: 0.01
    max_volume: 0.02
    sl:
      base_atr_mult: 1.8
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 2.8
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.5
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: true
      flip_threshold: 0.45
      time_exit_cycles: 240
      hesitation_cycles: 2
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.0
  statarb_dynamic:
    enabled: false  # FIX-20260529-036: disabled — 228 trades/-$2.17, 35.5% WR, bleeding artery
    timeframe: M5
    magic: 90003
    strategy_family: mean_reversion
    brain_types:
    - ou_params_v6
    base_volume: 0.02
    max_volume: 0.03
    confidence_threshold: 0.35
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_sl_distance: 8.0
      min_rr_ratio: 1.5
    tp:
      base_atr_mult: 3.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.0
    exit:
      trail_enabled: true
      trail_atr_mult: 1.5
      trail_atr_mult_low: 1.8
      trail_atr_mult_high: 2.5
      breakeven_threshold_atr: 0.5
      flip_exit_enabled: false
      time_exit_cycles: 40
      zscore_exit_enabled: true
      confidence_decay_exit: false
      hesitation_cycles: 6
    budget:
      daily_loss_limit_pct: -0.03
      max_consecutive_losses: 7
    direction_balance:
      long_bias_discount: 0.1
    min_p_win: 0.45
  statarb_m15:
    enabled: false  # FIX-20260529-036: disabled — paired with statarb_dynamic. OU brains retained for MetaFilter input only
    timeframe: M15
    magic: 90103
    strategy_family: mean_reversion
    brain_types:
    - ou_params_v6
    base_volume: 0.01
    max_volume: 0.02
    confidence_threshold: 0.3
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 4.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.5
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: false
      time_exit_cycles: 120
      zscore_exit_enabled: true
      confidence_decay_exit: false
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 7
    direction_balance:
      long_bias_discount: 0.0
    min_p_win: 0.45
  daily_swing:
    enabled: false
    timeframe: D1
    magic: 90301
    brain_types:
    - xgboost_v9
    - lightgbm_v1
    base_volume: 0.01
    max_volume: 0.03
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 3.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.0
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 1440
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.02
      max_consecutive_losses: 3
    direction_balance:
      long_bias_discount: 0.0
  m15_swing:
    enabled: true
    timeframe: M15
    magic: 90310
    brain_types:
    - xgboost_v9
    base_volume: 0.01
    max_volume: 0.03
    confidence_threshold: 0.35  # FIX-20260529-039: lowered from 0.45 — counter_trend penalise
                                # (conf×0.60) drops 0.50→0.30, which was below old gate.
                                # Now penalised signals survive to RR/MetaFilter checks.
    min_p_win: 0.40          # FIX-20260529-055: lowered from 0.45 — rolling 100-trade WR
                              # drifted from 0.458 (when FIX-039 set 0.45) to 0.400.
                              # 0.40 matches current estimate while blocking truly broken signals.
                              # Lifetime PnL +$2.75 over 146 trades confirms positive expectancy.
    max_spread_points: 60     # FIX-20260529-038: M15 swing — block when spread >= 60 pts
    spread_points: 30         # FIX-20260529-030: SL/TP spread cost alignment (XAUUSDc typical)
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_rr_ratio: 0.85  # FIX-20260529-039: lowered from 1.0 — spread_points=30 pushes
                           # net RR below gross 1:1. 0.85 allows post-spread RR ≥ 0.85
                           # (breakeven=0.50, so this still filters strictly negative EV).
    tp:
      base_atr_mult: 2.0  # FIX-20260529-039: 1.5→2.0 — symmetric SL/TP + spread →
                           # net_RR=0.935<1.0 makes Kelly always negative.
                           # TP=2.0 gives net_RR=1.258, breakeven WR=44.3% < p_win=45.8%.
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.5
    exit:
      trail_enabled: true
      trail_atr_mult: 1.5
      trail_atr_mult_low: 1.3
      trail_atr_mult_high: 2.5
      breakeven_threshold_atr: 1.2
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 72
      confidence_decay_exit: true
      min_r_for_hold: 0.15
      hesitation_cycles: 4
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.0
  m30_swing:
    enabled: true
    timeframe: M30
    magic: 90320
    brain_types:
    - xgboost_v9
    base_volume: 0.01
    max_volume: 0.03
    confidence_threshold: 0.35  # FIX-20260529-039: lowered from 0.45 — counter_trend penalise
                                # (conf×0.60) drops 0.50→0.30, which was below old gate.
                                # Now penalised signals survive to RR/MetaFilter checks.
    min_p_win: 0.45          # FIX-20260529-039: lowered from default 0.50 — trend strategies
                              # can use 0.48 (code comment). 0.45 allows brain cold-start
                              # (current rolling WR=0.463) while blocking truly broken signals.
    max_spread_points: 70     # FIX-20260529-038: M30 swing — block when spread >= 70 pts
    spread_points: 30         # FIX-20260529-030: SL/TP spread cost alignment (XAUUSDc typical)
    sl:
      base_atr_mult: 1.5
      hard_sl_ratio: 1.5
      dynamic: true
      min_rr_ratio: 0.85  # FIX-20260529-039: lowered from 1.0 — spread_points=30 pushes
                           # net RR below gross 1:1. 0.85 allows post-spread RR ≥ 0.85
                           # (breakeven=0.50, so this still filters strictly negative EV).
    tp:
      base_atr_mult: 2.0  # FIX-20260529-039: 1.5→2.0 (same rationale as m15_swing)
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 1.5
    exit:
      trail_enabled: true
      trail_atr_mult: 1.5
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 36
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 4
    direction_balance:
      long_bias_discount: 0.0
  h1_swing:
    enabled: false
    timeframe: H1
    magic: 90330
    brain_types:
    - xgboost_v9
    - lightgbm_v1
    base_volume: 0.01
    max_volume: 0.02
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 3.5
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.0
    exit:
      trail_enabled: true
      trail_atr_mult: 2.5
      trail_atr_mult_low: 2.0
      trail_atr_mult_high: 3.5
      breakeven_threshold_atr: 1.5
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 288
      confidence_decay_exit: true
      min_r_for_hold: 0.0
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 3
    direction_balance:
      long_bias_discount: 0.0
  h4_swing:
    enabled: false
    timeframe: H4
    magic: 90340
    brain_types:
    - xgboost_v9
    base_volume: 0.01
    max_volume: 0.02
    confidence_threshold: 0.45
    sl:
      base_atr_mult: 2.0
      hard_sl_ratio: 1.5
      dynamic: true
    tp:
      base_atr_mult: 4.0
      partial_tp_enabled: true
      partial_tp_ratio: 0.5
      partial_tp_r: 2.5
    exit:
      trail_enabled: true
      trail_atr_mult: 2.0
      flip_exit_enabled: true
      flip_threshold: 0.4
      time_exit_cycles: 864
      hesitation_cycles: 3
    budget:
      daily_loss_limit_pct: -0.015
      max_consecutive_losses: 2
    direction_balance:
      long_bias_discount: 0.0
portfolio_risk:
  max_gross_exposure: 0.1
  max_net_exposure: 0.05
  max_same_direction_strategies: 2
  netting_mode: net_out
  execution_stagger_seconds: 20
regime_gate:
  adx:
    trending_threshold: 30
    mild_trend_threshold: 20
  atr_percentile:
    high_vol_threshold: 80
    low_vol_threshold: 20
  regime_map:
    trending:
      barrier_12bar: full
      barrier_12bar_meta: reduced
      micro_3bar: reduced
      micro_m15: reduced
      micro_h1: full
      statarb_dynamic: reduced
      statarb_m15: reduced
    mild_trend:
      barrier_12bar: full
      barrier_12bar_meta: reduced
      micro_3bar: full
      micro_m15: full
      micro_h1: full
      statarb_dynamic: reduced
      statarb_m15: reduced
    ranging:
      barrier_12bar: reduced
      barrier_12bar_meta: full
      micro_3bar: reduced
      micro_m15: reduced
      micro_h1: reduced
      statarb_dynamic: full
      statarb_m15: full
    high_vol:
      barrier_12bar: false
      barrier_12bar_meta: reduced
      micro_3bar: full
      micro_m15: full
      micro_h1: reduced
      statarb_dynamic: reduced
      statarb_m15: reduced
    low_vol:                           # FIX-20260529-037: ATR < 20th percentile — liquidity vacuum gate
      barrier_12bar: reduced
      barrier_12bar_meta: reduced
      micro_3bar: false
      micro_m15: false
      micro_h1: false
      statarb_dynamic: false
      statarb_m15: false
      m15_swing: reduced
      m30_swing: reduced
      h1_swing: reduced
      h4_swing: reduced
      daily_swing: false
    normal:
      barrier_12bar: full
      barrier_12bar_meta: full
      micro_3bar: full
      micro_m15: full
      micro_h1: full
      statarb_dynamic: full
      statarb_m15: full
shadow:
  shadow_config: configs/live_shadow_config.json
  compare_report_dir: reports/shadow_compare
healthcheck:
  enabled: true
  check_interval_minutes: 15
  components:
  - name: data_freshness
    max_staleness_sec: 300
  - name: signal_heartbeat
    max_staleness_sec: 60
  - name: mt5_connection
    symbol: XAUUSDc
  - name: journal_health
    max_consecutive_rejects: 3
