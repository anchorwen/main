repos:
  - repo: local
    hooks:
      - id: ruff
        name: "ruff"
        entry: ruff check --fix --extend-select=BLE
        language: system
        files: \.py$
        stages: [pre-commit]
        pass_filenames: true
      - id: ruff-format
        name: "ruff-format"
        entry: ruff format
        language: system
        files: \.py$
        stages: [pre-commit]
        pass_filenames: true

  # ------------------------------------------------------------------
  # mypy type-check — iron law gate
  # Blocks commit if any staged .py file has MORE mypy errors than baseline.
  # Update baseline: python scripts/pre_commit_mypy.py --update-baseline
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy-iron-law
        name: "[铁律] mypy type-check (no new errors)"
        entry: python scripts/pre_commit_mypy.py
        language: system
        files: \.py$
        stages: [pre-commit]
        pass_filenames: false
        require_serial: true

  # ------------------------------------------------------------------
  # 架构文档门禁 — 改动 core/ apps/ scripts/ configs/ main.py 时自动刷新
  # 模式: AUTO-UPDATE (扫描 → 生成 → 自动 git add)
  # 绕过: ARCHITECTURE_GATE_BYPASS=1
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: enforce-architecture-docs
        name: "[门禁] 架构文档自动刷新"
        entry: python roadmap/scripts/architecture_gate.py
        language: system
        files: ^(core/|apps/|scripts/|configs/|main\.py)
        stages: [pre-commit]
        pass_filenames: false

  # ------------------------------------------------------------------
  # 蓝图一致性门禁 — 验证模块蓝图、修复注册表、依赖图一致性
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: blueprint-consistency
        name: "[门禁] 蓝图一致性验证"
        entry: python scripts/validate_blueprints.py
        language: system
        files: ^(blueprints/|core/|apps/|scripts/)
        stages: [pre-commit]
        pass_filenames: false

  # ------------------------------------------------------------------
  # Iron Law #1 全量验证门禁 — 任何 .py 改动后自动触发
  # mypy + ruff + blueprint compliance + artifact contract
  # 失败 = 提交阻断。不会漏跑。
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: verify-iron-law
        name: "[铁律 #1] 全量验证 (mypy+ruff+blueprint+artifact)"
        entry: python scripts/verify.py --quick
        language: system
        files: \.py$
        stages: [pre-commit]
        pass_filenames: false
        require_serial: true

  # ------------------------------------------------------------------
  # 账本禁动令 — 测试覆盖率 < 80% 时拦截 core/contracts/ + core/ledger/
  # 绕过: set JOURNAL_FREEZE_BYPASS=APPROVED_BY_ARCH_REVIEW
  # FIX-20260604-087: 架构修正案 Phase 3
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: journal-freeze-gate
        name: "[铁律] 账本禁动 — 覆盖率<80% 拦截修改"
        entry: python scripts/journal_freeze_gate.py
        language: system
        files: ^(core/contracts/label_contract\.py|core/ledger/)
        stages: [pre-commit]
        pass_filenames: false

  # ------------------------------------------------------------------
  # Ω Protocol — physical commit-message gate
  # Rejects commits without [Ω-Routing: Scene X -> ...] signature.
  # Hot-path files require #10 in signature.
  # FIX-20260612-002: Phase 1 of Systemic Operating System
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: omega-routing
        name: "[Ω] Routing signature required"
        entry: python scripts/omega_gate.py
        language: system
        stages: [commit-msg]
        pass_filenames: false

  # ------------------------------------------------------------------
  # Ω Architecture Gate — Iron Law #12 physical enforcement
  # Blocks commits when a module has >=3 L1/L2 fixes in 30 days
  # and the current commit is not L3. Also detects RC recurrence.
  # DRY-RUN by default. Set ARCH_GATE_MODE=live to activate.
  # Override: --no-verify with FIX-ARCH-OVERRIDE reason.
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: architecture-gate
        name: "[Ω] Iron Law #12 Architecture Gate"
        entry: python scripts/hook_architecture_gate.py
        language: system
        stages: [commit-msg]
        pass_filenames: false

  # ------------------------------------------------------------------
  # CI-Mirror Gate — pre-push: mirrors GitHub Actions before allowing push
  # Runs ruff (full codebase) + mypy (baseline) — same as ci-windows.yml.
  # Blocks push if checks fail.  No stash — safe with live processes.
  # Install: pre-commit install --hook-type pre-push
  # Override: git push --no-verify  (requires reason in commit message)
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ci-mirror-ruff
        name: "[CI-Mirror] Ruff full-codebase (core/ apps/ scripts/)"
        entry: python -m ruff check core/ apps/ scripts/
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ci-mirror-mypy
        name: "[CI-Mirror] Mypy baseline check"
        entry: python scripts/pre_commit_mypy.py
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      - id: ci-mirror-pytest
        name: "[CI-Mirror] Pytest full suite (UGR-A10)"
        entry: python -m pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

  # AST Scanner (UGR-A10)
  - repo: local
    hooks:
      - id: verify-capresult-ast
        name: "[UGR-A10] AST structural constraint scanner"
        entry: python scripts/verify_capresult_ast.py
        language: system
        files: \.py$
        stages: [pre-commit]
        pass_filenames: false
        require_serial: true
