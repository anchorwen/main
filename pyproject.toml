[project]
name = "adaptive-trading-system"
version = "0.1.0"
description = "Institution-grade adaptive quantitative trading system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0.1,<7.0.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.18,<2.0",
  "orjson>=3.10,<4.0",
  "pyzmq>=25.1,<27.0",
  "tenacity>=8.2,<9.0",
  "structlog>=24.1,<25.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  # Runtime ML deps — mirror Dockerfile:38-41 exactly (FIX-20260816-001).
  # These were declared in the Docker image but omitted from the package
  # manifest; CI installs only from pyproject (`pip install -e ".[dev]"`),
  # so a clean env lacked lightgbm → flow46 transfer test hard-import failed.
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "lightgbm>=4.3,<5.0",
  "xgboost>=2.1,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<0.6",
  "mypy>=1.10,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "pyarrow>=15.0,<20.0",
  "hypothesis>=6.100,<7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# scripts/archive/ = retired, not for VCS (gitignored).  It is not part of
# the codebase and must not fail the ci-mirror full-scan gate.  (exclude is
# used over respect-gitignore: ruff 0.5.7 does not honor gitignore when the
# gate scans `core/ apps/ scripts/` explicitly.)
extend-exclude = ["scripts/archive/"]

[tool.ruff.lint]
# SIM105 (contextlib.suppress vs try/except/pass): style preference,
# suppressed globally per team agreement.  FOG-migration-produced
# try/except/pass patterns are intentionally retained.
# To re-enable: remove "SIM105" from ignore and run a focused cleanup.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "E402",
    "E741",
    "F811",
    "B018",
    "F841",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Diagnostic/audit scripts — throwaway tools, style rules waived
"scripts/audit_*.py" = ["E302", "E305", "E701", "E702", "E401", "F401", "B007", "UP017", "I001", "SIM105", "E722", "UP038"]
# Forensic probe scripts (_audit_*_YYYYMMDD.py, IC-mandated uncommitted):
# same waiver as audit_*.py plus UP009/UP015/UP031 (encoding decl / open mode
# / percent-format) — IC 2026-08-05 ruling: keep in work tree, don't modify.
"scripts/_audit_*.py" = ["E302", "E305", "E701", "E702", "E401", "F401", "B007", "UP017", "I001", "SIM105", "E722", "UP038", "UP009", "UP015", "UP031", "UP032", "F541", "E731", "B023", "UP034"]
"scripts/analyze_*.py" = ["E722", "B007", "SIM105", "UP038", "F401", "F541", "UP015", "UP017", "I001"]
"scripts/diagnose_*.py" = ["SIM105", "F401", "I001", "E701", "BLE001"]  # DQAF-059: diagnostic tool, audit scripts
"scripts/classify_ble001.py" = ["E401", "E701", "F401", "I001"]
"scripts/diagnose_feature_drift.py" = ["E701", "F401", "I001"]
"scripts/_check_*.py" = ["E401", "E701", "I001"]
"scripts/backfill_*.py" = ["SIM105", "UP038", "I001"]
"scripts/dedup_*.py" = ["B007", "SIM105", "I001"]
"scripts/inject_*.py" = ["UP038", "I001"]
"scripts/system_*.py" = ["B007", "SIM105", "I001"]
"scripts/verify_*.py" = ["SIM105", "E722", "I001", "UP038"]
"scripts/check_*.py" = ["SIM105", "I001"]
"scripts/training/*.py" = ["E701", "E702", "UP038", "I001", "F401"]
"scripts/mt5_bridge_worker.py" = ["SIM105", "BLE001"]  # BLE001: DQAF-059 pre-existing FOG patterns (Phase 2 backlog)
"scripts/validate_magic_sync.py" = ["BLE001"]  # DQAF-059: CI gate, YAML parse uses fail_open pattern
"scripts/augment_journal_strategy.py" = ["BLE001"]  # DQAF-059: augment tool, JSON parse uses fail_open pattern
"core/contracts/strategy_magic.py" = ["BLE001"]  # DQAF-059: YAML config parse uses fail_open pattern
"core/features/computers/btc_feature_augmenter.py" = ["BLE001"]  # DQAF-059: pre-existing FOG patterns, MT5 data fetch fail_open
"core/features/computers/live_daily_provider.py" = ["BLE001"]  # DQAF-059: pre-existing FOG patterns, D1 CSV sync fail_open guard
"scripts/train_*.py" = ["UP038", "I001"]
# Pre-existing tech debt — documented, not urgent
"core/runtime/data_health_monitor.py" = ["SIM105", "F401", "UP017"]
"core/runtime/execution_state.py" = ["SIM105"]
"core/execution/managed_close.py" = ["BLE001"]  # DQAF-059: pre-existing BLE001:FOG patterns, close dispatch fail-open guards
"core/observability/health_checks.py" = ["BLE001"]  # DQAF-058: pre-existing BLE001:FOG patterns, all wrapped in fail_open_guard
"core/observability/data_health_service.py" = ["BLE001"]  # DQAF-058: pre-existing BLE001:FOG in _run() check farm dispatch
"core/protocol/event_bar_sync.py" = ["BLE001"]  # DQAF-059: pre-existing BLE001:FOG patterns, MT5 reconnect/init fail-open (registered FIX-20260820-001)
"core/training/__init__.py" = ["F401"]
"scripts/check_preconditions.py" = ["I001", "UP038"]
"tests/unit/test_execution_state.py" = ["I001", "F401"]
"tests/unit/test_trail_stop_engine.py" = ["I001"]
"tests/data/test_contracts.py" = ["B017"]
"tests/data/test_wap.py" = ["B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov-report=json --cov-report=term --cov-branch"
markers = [
  "fast_contracts: fast communication/v9-shadow contract suite",
  "staged_regression: staged communication/v9-shadow regression suite",
  "governance_contracts: governance summary contract suite",
  "slow: integration/E2E tests that perform file I/O, MT5 simulation, or state loading",
]

[tool.coverage.run]
# Journal freeze gate protected paths (FIX-20260604-087 Phase 3)
# When coverage.json exists and protected paths ≥ 80% line+branch,
# the pre-commit gate allows journal modifications.
source = ["core"]

[tool.coverage.report]
# Fail under 80% on protected paths (checked by journal_freeze_gate.py)
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.mypy]
python_version = "3.11"
# ── Critical checks (iron law) ──
check_untyped_defs = true       # catches unbound variables, conditional binding
warn_unused_ignores = true      # prevents type: ignore rot
no_implicit_optional = true     # None safety
warn_redundant_casts = true
strict_equality = true
warn_unused_configs = true
# ── Practical relaxations (third-party libs are untyped) ──
follow_imports = "skip"
ignore_missing_imports = true
# ── Gradual tightening (enable as types are added) ──
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# disallow_untyped_calls = true
