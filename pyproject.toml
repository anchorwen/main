[project]
name = "adaptive-trading-system"
version = "0.1.0"
description = "Institution-grade adaptive quantitative trading system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0.1,<7.0.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.18,<2.0",
  "orjson>=3.10,<4.0",
  "tenacity>=8.2,<9.0",
  "structlog>=24.1,<25.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<0.6",
  "mypy>=1.10,<2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fast_contracts: fast communication/v9-shadow contract suite",
  "staged_regression: staged communication/v9-shadow regression suite",
  "governance_contracts: governance summary contract suite",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
